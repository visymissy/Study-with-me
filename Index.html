<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>📚 Study Quest</title>
<style>
:root{
  --cream:#FBF6EE;
  --pink:#F6C6D0;
  --pink-deep:#EE9AAE;
  --lavender:#D9CCF0;
  --lavender-deep:#B6A0E0;
  --blue:#BFE1EE;
  --sage:#C3D6BA;
  --peach:#F6D3AE;
  --brown:#7C5B45;
  --yellow:#F5E3A8;
  --ink:#4A3F3A;
  --ink-soft:#8A7C74;
  --card:#FFFFFF;
  --shadow: 0 6px 18px rgba(124,91,69,0.10);
  --shadow-sm: 0 3px 8px rgba(124,91,69,0.08);
  --radius:20px;
  --radius-sm:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif;
  background:linear-gradient(180deg,#FBF6EE,#FDF1F2 40%,#F5F0FB);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Trebuchet MS',sans-serif; margin:0 0 8px 0;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--pink); border-radius:8px;}

/* LAYOUT */
#appwrap{display:flex; min-height:100vh;}
#sidebar{
  width:220px; flex-shrink:0; background:linear-gradient(180deg,#fff,#FCF3F6);
  border-right:1px solid #f1e3e8; padding:18px 10px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
#sidebar .brand{padding:6px 10px 18px 10px; font-weight:bold; font-size:1.25em; color:var(--brown);}
#sidebar .brand span{display:block; font-size:0.55em; font-weight:normal; color:var(--ink-soft); margin-top:2px;}
.navbtn{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:10px 12px; border:none;
  background:transparent; border-radius:12px; font-size:0.92em; color:var(--ink); margin-bottom:2px;
  transition:background .15s, transform .15s;
}
.navbtn:hover{background:#F6EAF0;}
.navbtn.active{background:var(--pink); color:#7a3b4a; font-weight:bold; box-shadow:var(--shadow-sm);}
#main{flex:1; min-width:0; padding:22px 26px 90px 26px; max-width:1100px; margin:0 auto; width:100%;}
#topbar{display:none;}

/* MOBILE */
@media (max-width:880px){
  #sidebar{display:none;}
  #topbar{
    display:flex; align-items:center; justify-content:space-between; padding:12px 16px;
    background:#fff; border-bottom:1px solid #f1e3e8; position:sticky; top:0; z-index:20;
  }
  #topbar .brand{font-weight:bold; color:var(--brown);}
  #main{padding:14px 12px 90px 12px;}
  #bottomnav{
    display:flex; position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #f1e3e8;
    overflow-x:auto; z-index:30; padding:4px 2px;
  }
  #bottomnav .navbtn{flex-direction:column; gap:2px; font-size:0.62em; min-width:64px; padding:6px 4px; white-space:nowrap;}
  #bottomnav .navbtn span.ic{font-size:1.3em;}
}
@media (min-width:881px){ #bottomnav{display:none;} }

/* CARDS */
.card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:16px;}
.card-sm{border-radius:var(--radius-sm); box-shadow:var(--shadow-sm); padding:14px;}
.grid{display:grid; gap:14px;}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.btn{
  background:var(--pink); border:none; color:#7a3b4a; padding:9px 16px; border-radius:999px; font-weight:bold;
  box-shadow:var(--shadow-sm); font-size:0.9em; transition:transform .12s;
}
.btn:active{transform:scale(0.96);}
.btn.blue{background:var(--blue); color:#2c5266;}
.btn.sage{background:var(--sage); color:#2e4a2a;}
.btn.lav{background:var(--lavender); color:#4a3878;}
.btn.peach{background:var(--peach); color:#7a4a1f;}
.btn.yellow{background:var(--yellow); color:#7a6420;}
.btn.ghost{background:#F3EDF7; color:var(--ink);}
.btn.danger{background:#f3c8c8; color:#7a2b2b;}
.btn:disabled{opacity:0.5;}
input,textarea,select{
  font-family:inherit; padding:9px 11px; border-radius:12px; border:1px solid #EADFE6; background:#FFFCFA;
  font-size:0.9em; width:100%;
}
label{font-size:0.78em; color:var(--ink-soft); display:block; margin:8px 0 3px 0; font-weight:bold;}
.pill{display:inline-block; padding:3px 10px; border-radius:999px; font-size:0.72em; font-weight:bold; background:#F3EDF7;}
.muted{color:var(--ink-soft); font-size:0.85em;}
.progress-track{background:#F1E9EE; border-radius:999px; height:12px; overflow:hidden;}
.progress-fill{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--pink-deep),var(--lavender-deep)); transition:width .4s;}
.hr{height:1px; background:#F1E5EA; margin:14px 0; border:none;}
.section-title{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
.emoji-big{font-size:1.6em;}
.list-item{display:flex; align-items:flex-start; gap:10px; padding:10px; border-radius:12px; background:#FBF7FA; margin-bottom:8px;}
.list-item.done{opacity:0.55; text-decoration:line-through;}
.checkbox{width:22px; height:22px; border-radius:8px; border:2px solid var(--pink-deep); flex-shrink:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center; background:#fff;}
.checkbox.checked{background:var(--pink-deep);}
.tag{font-size:0.7em; padding:2px 8px; border-radius:999px; background:#EEE6F5; color:#5a4680; margin-right:4px;}
.flex-between{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;}
.icon-btn{background:transparent; border:none; font-size:1.1em; padding:4px;}
.small{font-size:0.78em;}
.stars{color:#e0a83b;}

/* Modal */
#modalbg{position:fixed; inset:0; background:rgba(74,63,58,0.35); display:none; align-items:center; justify-content:center; z-index:100; padding:14px;}
#modalbg.open{display:flex;}
#modalbox{background:#fff; border-radius:20px; max-width:520px; width:100%; max-height:88vh; overflow-y:auto; padding:20px; box-shadow:0 20px 50px rgba(0,0,0,0.25);}

/* Toasts */
#toasts{position:fixed; top:14px; right:14px; z-index:200; display:flex; flex-direction:column; gap:8px; max-width:320px;}
.toast{background:#fff; border-radius:14px; box-shadow:var(--shadow); padding:12px 16px; font-size:0.88em; animation:popin .25s ease;}
@keyframes popin{from{transform:translateY(-8px); opacity:0;} to{transform:translateY(0); opacity:1;}}

/* dashboard hero */
.hero{
  background:linear-gradient(135deg,var(--pink) 0%, var(--lavender) 60%, var(--blue) 100%);
  border-radius:24px; padding:22px; color:#5a3f52; box-shadow:var(--shadow); position:relative; overflow:hidden;
}
.hero .deco{position:absolute; font-size:2.2em; opacity:0.35;}
.statchip{background:rgba(255,255,255,0.6); border-radius:14px; padding:8px 14px; text-align:center; min-width:80px;}
.statchip b{display:block; font-size:1.3em;}
.statchip span{font-size:0.68em; color:#6a5563;}

/* animations */
@keyframes sparkle{0%{transform:scale(0.5) rotate(0deg); opacity:0;}50%{opacity:1;}100%{transform:scale(1.3) rotate(20deg); opacity:0;}}
.sparkle{position:fixed; font-size:1.8em; animation:sparkle 1s ease forwards; z-index:300; pointer-events:none;}
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.floaty{animation:floaty 3s ease-in-out infinite;}
@keyframes growplant{from{transform:scaleY(0.2);} to{transform:scaleY(1);}}

.character-box{display:flex; align-items:center; justify-content:center; font-size:4em; background:#FCF3F6; border-radius:18px; padding:18px;}
.confidence-dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:4px;}
table.simple{width:100%; border-collapse:collapse;}
table.simple td,table.simple th{padding:6px 8px; text-align:left; font-size:0.85em; border-bottom:1px solid #f1e5ea;}
.subj-icon{font-size:1.4em;}
</style>
</head>
<body>

<div id="toasts"></div>
<div id="modalbg"><div id="modalbox"></div></div>

<div id="appwrap">
  <div id="sidebar"></div>
  <div id="mobilewrap" style="flex:1; min-width:0;">
    <div id="topbar">
      <div class="brand">📚 Study Quest</div>
      <div class="row" id="topbar-stats"></div>
    </div>
    <div id="main"></div>
  </div>
</div>
<div id="bottomnav"></div>

<script>
/* ============================= STUDY QUEST ============================= */
/* ---------- CONSTANTS ---------- */
const NAV = [
  ['dashboard','🏠','Dashboard'],
  ['quests','🎯','Daily Quests'],
  ['subjects','📚','Subjects'],
  ['quiz','❓','Quiz'],
  ['recall','🧠','Active Recall'],
  ['blurt','💨','Blurting'],
  ['teach','🎤','Teach It'],
  ['timer','⏱️','Study Timer'],
  ['papers','📄','Practice Papers'],
  ['mistakes','❌','Mistake Log'],
  ['review','🔁','Review'],
  ['calendar','📅','Calendar'],
  ['progress','📊','Progress'],
  ['achievements','🏆','Achievements'],
  ['rewards','🪙','Rewards'],
  ['character','🧍','Character'],
  ['notes','📝','Notes'],
  ['ideas','💡','Ideas'],
  ['ai','🤖','AI Prompts'],
  ['settings','⚙️','Settings'],
];

const SUBJECT_DEFS = {
  english:{name:'English', icon:'🇬🇧', color:'var(--blue)'},
  chinese:{name:'Chinese', icon:'🇨🇳', color:'var(--peach)'},
  history:{name:'History', icon:'📜', color:'var(--brown)'},
  science:{name:'Science', icon:'🔬', color:'var(--sage)'},
  geography:{name:'Geography', icon:'🌍', color:'var(--blue)'},
  literature:{name:'Literature', icon:'📖', color:'var(--lavender)'},
  mathematics:{name:'Mathematics', icon:'➗', color:'var(--pink)'},
};

const MISTAKE_CATS = ["🧠 Didn't understand","📖 Forgot","➗ Calculation error","👀 Misread question","📝 Didn't explain enough","⏰ Ran out of time","🤔 Misunderstood concept","🔢 Careless mistake","📚 Didn't know content"];
const QUEST_CATS = ['📚 Learn','🧠 Active Recall','❓ Quiz','📝 Practice','❌ Mistake Review','📄 Practice Paper','🎤 Teach','🌱 Review'];
const REVIEW_LEVELS = ['new','learning','familiar','strong','mastered'];
const REVIEW_LABEL = {new:'🌱 New',learning:'🌿 Learning',familiar:'🌸 Familiar',strong:'⭐ Strong',mastered:'🏆 Mastered'};
const REVIEW_INTERVAL = {new:1,learning:3,familiar:7,strong:14,mastered:30};
const LEVEL_TITLES = ['🌱 Curious Beginner','🌿 Getting Started','🌷 Growing Scholar','⭐ Focused Explorer','📚 Knowledge Builder','🦋 Confident Learner','🏆 Study Master'];
const EXAM_CAMPAIGN = {
  start:'2026-08-28', mainExam:'2026-09-28',
  dates:[
    {date:'2026-09-28', subject:'english', label:'English'},
    {date:'2026-09-29', subject:'chinese', label:'Chinese'},
    {date:'2026-09-30', subject:'history', label:'History'},
    {date:'2026-10-01', subject:'science', label:'Science'},
    {date:'2026-10-05', subject:'literature', label:'Literature'},
    {date:'2026-10-06', subject:'mathematics', label:'Mathematics'},
    {date:'2026-10-07', subject:'english', label:'English Listening'},
    {date:'2026-10-08', subject:null, label:'Rest'},
  ]
};
const ENCOURAGEMENTS = [
  "Tiny progress still counts. 🌱","You don't need to know everything today.",
  "Let's find the next thing to practise.","Your mistakes are literally telling us what to study next.",
  "Understanding > memorising blindly.","Future you will thank you.","Now we know what to practise. 🌷",
  "One question at a time. 🌷","Small steps still move the campaign forward."
];
const ACHIEVEMENT_DEFS = [
  {id:'first_quest', icon:'🌱', name:'First Quest', desc:'Complete your first study task.', cond:s=>s.stats.questsCompleted>=1},
  {id:'quiz_starter', icon:'❓', name:'Quiz Starter', desc:'Complete your first quiz.', cond:s=>s.stats.quizzesCompleted>=1},
  {id:'scholar', icon:'📚', name:'Scholar', desc:'Complete 10 study quests.', cond:s=>s.stats.questsCompleted>=10},
  {id:'active_recaller', icon:'🧠', name:'Active Recaller', desc:'Complete 10 active recall sessions.', cond:s=>s.stats.recallSessions>=10},
  {id:'oops_learn', icon:'❌', name:'Oops → Learn', desc:'Correct your first logged mistake.', cond:s=>s.mistakes.some(m=>m.corrected)},
  {id:'practice_machine', icon:'🔥', name:'Practice Machine', desc:'Complete 10 practice sessions.', cond:s=>s.stats.practiceSessions>=10},
  {id:'paper_champion', icon:'📄', name:'Paper Champion', desc:'Complete 5 practice papers.', cond:s=>s.papers.length>=5},
  {id:'chinese_explorer', icon:'🇨🇳', name:'Chinese Explorer', desc:'Review all 50 vocabulary words.', cond:s=>s.vocab.every(v=>v.confidence!=='red')},
  {id:'oral_ready', icon:'🎤', name:'Oral Ready', desc:'Complete all 4 oral passages.', cond:s=>s.oralPassages.every(p=>p.progress>=100)},
  {id:'science_explorer', icon:'🔬', name:'Science Explorer', desc:'Complete 10 science topics.', cond:s=>(s.subjects.science.topics||[]).filter(t=>t.mastery>=80).length>=10},
  {id:'maths_grinder', icon:'➗', name:'Maths Grinder', desc:'Complete 100 maths questions.', cond:s=>s.stats.mathsQuestions>=100},
  {id:'campaign_complete', icon:'🏆', name:'Campaign Complete', desc:'Finish the exam preparation campaign.', cond:s=>Object.values(s.subjects).every(sub=>avgMastery(sub)>=90)},
];

/* ---------- STATE ---------- */
let state = null;
let currentView = 'dashboard';
let quizSession = null;
let timerSession = null;
let focusMode = false;

function defaultState(){
  const subjects = {};
  for(const key in SUBJECT_DEFS){
    subjects[key] = {
      priority: (key==='science'||key==='mathematics') ? 'high' : (key==='english'||key==='geography') ? 'low' : 'medium',
      confidence: 'yellow',
      studyMinutes: 0,
      topics: [],
      exam: EXAM_CAMPAIGN.dates.find(d=>d.subject===key)?.date || null,
    };
  }
  subjects.science.topics = [{id:uid(),name:'Cell Division',mastery:20,stage:0},{id:uid(),name:'Forces',mastery:10,stage:0}];
  subjects.mathematics.topics = [{id:uid(),name:'Algebra',mastery:30},{id:uid(),name:'Geometry',mastery:15}];
  subjects.history.topics = [{id:uid(),name:'World War II',mastery:20,cause:'',what:'',consequence:''}];
  subjects.literature.characters = [];
  subjects.chinese.oralDeadline = '2026-09-15';

  const vocab = [];
  for(let i=1;i<=50;i++) vocab.push({id:uid(), word:'词 '+i, meaning:'', example:'', confidence:'red'});
  const oralPassages = [1,2,3,4].map(i=>({id:uid(), name:'Passage '+i, progress:0, confidence:'red', lastReviewed:null, nextReview:null}));
  const oralTopics = [1,2,3,4,5,6].map(i=>({id:uid(), name:'Topic '+i, practiceCount:0}));
  const listening = [1,2,3,4,5,6,7].map(i=>({id:uid(), name:'Listening #'+i, done:false}));

  return {
    xp:0, coins:0, level:1,
    lastActiveDate: null,
    streaks:{study:0, quiz:0, practice:0, mistake:0},
    lastStreakDates:{study:null, quiz:null, practice:null, mistake:null},
    xpValues:{task:10, practice:15, quiz:20, paper:30, mistakeReview:15, teach:20, difficultTopic:30, session:20, rest:5},
    subjects, vocab, oralPassages, oralTopics, listening,
    quests:[], questions:[], mistakes:[], papers:[], notes:[], ideas:[], events:[],
    achievements:{},
    character:{skin:'#F2C49B', hair:'💇', outfit:'👕', accessory:'👓'},
    stats:{questsCompleted:0, quizzesCompleted:0, recallSessions:0, practiceSessions:0, mathsQuestions:0,
      studySessions:0, totalStudyMinutes:0, questionsAnswered:0, questionsCorrect:0, mistakesLogged:0, mistakesCorrected:0},
  };
}

function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function daysUntil(d){ const now=new Date(todayStr()+'T00:00:00'); const target=new Date(d+'T00:00:00'); return Math.round((target-now)/86400000); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function avgMastery(subj){ const t=subj.topics||[]; if(!t.length) return 0; return Math.round(t.reduce((a,b)=>a+b.mastery,0)/t.length); }
function masteryColor(m){ if(m>=96) return '#e0a83b'; if(m>=81) return '#f0c95e'; if(m>=61) return '#8fb86b'; if(m>=41) return '#f0d060'; if(m>=21) return '#f0a860'; return '#e08a8a'; }
function masteryLabel(m){ if(m>=96) return '🏆 Mastered'; if(m>=81) return '🌟 Strong'; if(m>=61) return '🟢 Confident'; if(m>=41) return '🟡 Learning'; if(m>=21) return '🟠 Beginning'; return '🔴 New'; }

function save(){ localStorage.setItem('studyQuestData', JSON.stringify(state)); }
function load(){
  const raw = localStorage.getItem('studyQuestData');
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = defaultState(); } }
  else { state = defaultState(); }
  // fill in any missing keys from newer versions
  const d = defaultState();
  for(const k in d){ if(!(k in state)) state[k]=d[k]; }
  for(const k in d.stats){ if(!(k in state.stats)) state.stats[k]=d.stats[k]; }
  for(const k in d.xpValues){ if(!(k in state.xpValues)) state.xpValues[k]=d.xpValues[k]; }
  checkDailyRollover();
}

function checkDailyRollover(){
  const today = todayStr();
  if(state.lastActiveDate !== today){
    // add preset daily quests once per day if not already present for today
    const presets = [
      {task:'Review Chinese oral', subject:'chinese', category:'🌱 Review'},
      {task:'Complete English listening', subject:'english', category:'📝 Practice'},
      {task:'Do 5 maths questions', subject:'mathematics', category:'📝 Practice'},
      {task:'Review a science topic', subject:'science', category:'🧠 Active Recall'},
      {task:'Complete a quiz', subject:'', category:'❓ Quiz'},
    ];
    presets.forEach(p=>{
      state.quests.push({id:uid(), task:p.task, subject:p.subject, topic:'', category:p.category, difficulty:'medium',
        xp:10, coins:5, dueDate:today, estTime:20, done:false, preset:true});
    });
    state.lastActiveDate = today;
    save();
  }
}

/* ---------- XP / LEVEL ---------- */
function xpForLevel(lvl){ return lvl*100; }
function addXP(amount, reason){
  state.xp += amount;
  let leveled=false;
  while(state.xp >= xpForLevel(state.level)){
    state.xp -= xpForLevel(state.level);
    state.level += 1;
    leveled = true;
  }
  save();
  spawnSparkle('✨');
  toast(`+${amount} XP${reason?' · '+reason:''}`);
  if(leveled){
    const title = LEVEL_TITLES[state.level-1] || `🏆 Level ${state.level} Scholar`;
    setTimeout(()=>toast(`🎉 LEVEL UP! You're now Level ${state.level}: ${title}`), 350);
  }
  checkAchievements();
}
function addCoins(amount, reason){
  state.coins += amount; save();
  if(amount>0) toast(`🪙 +${amount} coins${reason?' · '+reason:''}`);
}
function levelTitle(){ return LEVEL_TITLES[state.level-1] || `🏆 Level ${state.level} Scholar`; }

function checkAchievements(){
  ACHIEVEMENT_DEFS.forEach(a=>{
    if(!state.achievements[a.id] && a.cond(state)){
      state.achievements[a.id] = true;
      save();
      setTimeout(()=>toast(`🏆 Achievement unlocked: ${a.icon} ${a.name}`), 500);
      spawnSparkle('🏆');
    }
  });
}
function bumpStreak(kind){
  const today = todayStr();
  if(state.lastStreakDates[kind] === today) return;
  const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
  state.streaks[kind] = (state.lastStreakDates[kind]===y) ? state.streaks[kind]+1 : 1;
  state.lastStreakDates[kind] = today;
  save();
}

/* ---------- TOASTS / SPARKLES ---------- */
function toast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>el.remove(), 3400);
}
function spawnSparkle(ch){
  const el=document.createElement('div');
  el.className='sparkle'; el.textContent=ch;
  el.style.left=(40+Math.random()*(window.innerWidth-80))+'px';
  el.style.top=(80+Math.random()*200)+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1000);
}
function randomEncourage(){ return ENCOURAGEMENTS[Math.floor(Math.random()*ENCOURAGEMENTS.length)]; }

/* ---------- MODAL ---------- */
function openModal(html){ document.getElementById('modalbox').innerHTML = html; document.getElementById('modalbg').classList.add('open'); }
function closeModal(){ document.getElementById('modalbg').classList.remove('open'); }
document.getElementById('modalbg').addEventListener('click', e=>{ if(e.target.id==='modalbg') closeModal(); });

/* ---------- ROUTER / RENDER ---------- */
function go(view){ currentView=view; renderAll(); window.scrollTo(0,0); }
function renderAll(){
  renderNav();
  const el = document.getElementById('main');
  el.innerHTML = renderView(currentView);
  document.getElementById('topbar-stats').innerHTML = `<span class="pill">⭐ Lv${state.level}</span><span class="pill">🪙 ${state.coins}</span>`;
}
function renderNav(){
  const html = NAV.map(([id,icon,label])=>
    `<button class="navbtn ${currentView===id?'active':''}" onclick="go('${id}')"><span class="ic">${icon}</span> <span class="lbl">${label}</span></button>`
  ).join('');
  document.getElementById('sidebar').innerHTML = `<div class="brand">📚 Study Quest<span>Study smarter. Level up.</span></div>` + html;
  document.getElementById('bottomnav').innerHTML = NAV.map(([id,icon,label])=>
    `<button class="navbtn ${currentView===id?'active':''}" onclick="go('${id}')"><span class="ic">${icon}</span><span>${label}</span></button>`
  ).join('');
}
function renderView(id){
  switch(id){
    case 'dashboard': return viewDashboard();
    case 'quests': return viewQuests();
    case 'subjects': return viewSubjectsList();
    case 'subject': return viewSubjectDetail(routeParam);

function submitQuestion(){

    reviewLevel:'new', nextReview:todayStr(), correctCount:0, wrongCount:0,
  });
  save(); closeModal(); renderAll(); toast('Question added to the bank 📚');
}
function deleteQuestion(id){ state.questions = state.questions.filter(q=>q.id!==id); save(); renderAll(); }

function startQuiz(mode){
  let pool = state.questions.slice();
  const today = todayStr();
  if(mode==='weak') pool = pool.filter(q=>q.reviewLevel==='new'||q.reviewLevel==='learning'||q.wrongCount>q.correctCount);
  if(mode==='mistake') pool = pool.filter(q=>q.sourceMistakeId);
  if(pool.length===0){ toast('No questions available for this mode yet — add some first!'); return; }
  shuffle(pool);
  const count = mode==='quick'?5 : mode==='study'?10 : mode==='challenge'?20 : mode==='recall'?10 : pool.length;
  pool = pool.slice(0, Math.min(count,pool.length));
  quizSession = {mode, questions:pool, idx:0, results:[], revealed:false, mcSelected:null};
  go('quiz');
}
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } }

function viewQuizPlay(){
  if(quizSession.idx >= quizSession.questions.length) return viewQuizResults();
  const q = quizSession.questions[quizSession.idx];
  const isRecall = quizSession.mode==='recall';
  let body='';
  if(q.type==='mc'){
    body = (q.options||[]).map((o,i)=>`<button class="btn ${quizSession.mcSelected===o?'lav':'ghost'}" style="display:block; width:100%; text-align:left; margin-bottom:6px;" onclick="selectMC('${encodeURIComponent(o)}')">${o}</button>`).join('');
  } else if(q.type==='truefalse'){
    body = `<button class="btn ${quizSession.mcSelected==='True'?'lav':'ghost'}" onclick="selectMC('True')">True</button> <button class="btn ${quizSession.mcSelected==='False'?'lav':'ghost'}" onclick="selectMC('False')">False</button>`;
  } else {
    body = isRecall && !quizSession.revealed ? `<textarea id="recall-input" placeholder="Write everything you remember..." rows="5"></textarea>` : '';
  }
  return `
  <button class="btn ghost" onclick="quitQuiz()">← Exit quiz</button>
  <div class="card" style="margin-top:12px;">
    <div class="flex-between"><span class="pill">${quizSession.idx+1} / ${quizSession.questions.length}</span><span class="pill">${SUBJECT_DEFS[q.subject]?.icon||''} ${q.topic||q.subject||''}</span></div>
    <h3 style="margin-top:10px;">${q.question}</h3>
    ${body}
    ${quizSession.revealed ? `
      <div class="card-sm" style="background:#F3F8EE; margin-top:10px;">
        <b>Answer:</b> ${q.answer||'(see explanation)'}<br>
        ${q.explanation?`<span class="small muted">${q.explanation}</span>`:''}
      </div>
      <div class="row" style="margin-top:10px;">
        <button class="btn sage" onclick="gradeQuiz(true)">✅ I got it right</button>
        <button class="btn danger" onclick="gradeQuiz(false)">❌ I got it wrong</button>
      </div>
    ` : `<div class="row" style="margin-top:10px;"><button class="btn" onclick="revealQuiz()">👁️ Reveal Answer</button></div>`}
  </div>`;
}
function selectMC(val){ quizSession.mcSelected = decodeURIComponent(val); renderAll(); }
function revealQuiz(){ quizSession.revealed = true; renderAll(); }
function gradeQuiz(correct){
  const q = quizSession.questions[quizSession.idx];
  // auto grade for mc/tf if a selection made and revealed matches
  if((q.type==='mc'||q.type==='truefalse') && quizSession.mcSelected!=null){
    correct = quizSession.mcSelected.trim() === (q.answer||'').trim();
  }
  applyReview(q, correct);
  quizSession.results.push({q, correct});
  state.stats.questionsAnswered++;
  if(correct) state.stats.questionsCorrect++;
  quizSession.idx++; quizSession.revealed=false; quizSession.mcSelected=null;
  save(); renderAll();
}
function applyReview(q, correct){
  let li = REVIEW_LEVELS.indexOf(q.reviewLevel||'new');
  if(correct){ q.correctCount=(q.correctCount||0)+1; li = Math.min(li+1, REVIEW_LEVELS.length-1); }
  else { q.wrongCount=(q.wrongCount||0)+1; li = Math.max(li-1, 0); }
  q.reviewLevel = REVIEW_LEVELS[li];
  const days = correct ? REVIEW_INTERVAL[q.reviewLevel] : 1;
  const d = new Date(); d.setDate(d.getDate()+days);
  q.nextReview = d.toISOString().slice(0,10);
}
function quitQuiz(){ quizSession=null; go('quiz'); }
function viewQuizResults(){
  const results = quizSession.results;
  const correct = results.filter(r=>r.correct).length;
  const total = results.length;
  const acc = total? Math.round(correct/total*100):0;
  const byTopic = {};
  results.forEach(r=>{ const t=r.q.topic||'general'; byTopic[t]=byTopic[t]||{c:0,w:0}; r.correct?byTopic[t].c++:byTopic[t].w++; });
  const weak = Object.entries(byTopic).filter(([t,v])=>v.w>0).map(([t])=>t);
  const good = Object.entries(byTopic).filter(([t,v])=>v.w===0).map(([t])=>t);
  const xpEarned = state.xpValues.quiz;
  addXP(xpEarned,'quiz complete'); addCoins(10,'quiz complete');
  state.stats.quizzesCompleted++;
  if(quizSession.mode==='recall') state.stats.recallSessions++;
  bumpStreak('quiz');
  quizSession.scored = true;
  const res = quizSession;
  quizSession = null;
  save(); checkAchievements();
  const suggestion = weak.length ? `🌱 You missed questions on ${weak.join(', ')}. Try active recall or a quick review before retaking.` : `🎉 Great work — no weak topics this round!`;
  return `
  <div class="card" style="text-align:center;">
    <h2>✨ QUIZ COMPLETE!</h2>
    <h1>${correct} / ${total}</h1>
    <p>Accuracy: <b>${acc}%</b></p>
    <div class="row" style="justify-content:center;">
      <div class="statchip"><b>${correct}</b><span>correct</span></div>
      <div class="statchip"><b>${total-correct}</b><span>incorrect</span></div>
    </div>
    <div class="grid grid-2" style="margin-top:14px;">
      <div class="card-sm"><b>Struggled with</b><div class="muted">${weak.join(', ')||'none 🎉'}</div></div>
      <div class="card-sm"><b>Did well on</b><div class="muted">${good.join(', ')||'—'}</div></div>
    </div>
    <div class="card-sm" style="margin-top:10px; background:#F3F8EE;">${suggestion}</div>
    <button class="btn" style="margin-top:14px;" onclick="go('quiz')">Back to Quiz Hub</button>
  </div>`;
}

function viewTimer(){
  if(focusMode) return viewFocusMode();
  if(timerSession) return viewTimerActive();
  return `
  <h2>⏱️ Study Timer</h2>
  <p class="muted">Preferred focused sessions: 45–60 minutes. Breaks are part of the plan. 🌷</p>
  <div class="row">
    ${[15,20,25,30,45,50,60].map(m=>`<button class="btn" onclick="startTimer(${m})">${m} min</button>`).join('')}
  </div>
  <div class="row" style="margin-top:10px;">
    <input id="custom-min" type="number" placeholder="custom minutes" style="width:160px;">
    <button class="btn ghost" onclick="startTimer(+document.getElementById('custom-min').value||25)">Start custom</button>
  </div>
  <div class="card" style="margin-top:16px;">
    <h3>🧘 Focus Mode</h3>
    <p class="muted">Distraction-free: just your task, timer, and study buddy.</p>
    <label>What are you focusing on?</label>
    <input id="focus-task" placeholder="e.g. Cell Division practice questions">
    <button class="btn lav" style="margin-top:8px;" onclick="startFocus()">🧠 Enter Focus Mode</button>
  </div>`;
}
function startTimer(minutes){
  timerSession = {total:minutes*60, remaining:minutes*60, running:true, startedAt:Date.now()};
  go('timer'); tickTimer();
}
function tickTimer(){
  if(!timerSession) return;
  if(timerSession.running && timerSession.remaining>0){
    timerSession.remaining--;
    if(currentView==='timer') { document.getElementById('main').innerHTML = focusMode?viewFocusMode():viewTimerActive(); }
    if(timerSession.remaining<=0){ finishTimer(); return; }
    setTimeout(tickTimer,1000);
  }
}
function viewTimerActive(){
  const elapsed = timerSession.total - timerSession.remaining;
  const mins = Math.floor(timerSession.remaining/60), secs = timerSession.remaining%60;
  const books = Math.floor(elapsed/300)+1;
  const stars = Math.floor(elapsed/600);
  const plantScale = clamp(elapsed/timerSession.total,0.15,1);
  return `
  <h2>⏱️ Studying...</h2>
  <div class="card" style="text-align:center;">
    <div style="font-size:3em;">${'📚'.repeat(clamp(books,1,6))}</div>
    <div style="font-size:2.4em; font-weight:bold;">${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}</div>
    <div class="progress-track" style="margin:14px 0;"><div class="progress-fill" style="width:${(elapsed/timerSession.total)*100}%"></div></div>
    <div style="font-size:1.6em;">${'⭐'.repeat(stars)}</div>
    <div style="font-size:2em;">🌱<span style="display:inline-block; transform-origin:bottom; transform:scaleY(${plantScale}); transition:transform .4s;">🌿</span></div>
    <div class="row" style="justify-content:center; margin-top:10px;">
      <button class="btn" onclick="pauseTimer()">${timerSession.running?'⏸️ Pause':'▶️ Resume'}</button>
      <button class="btn danger" onclick="stopTimer()">⏹️ Stop</button>
    </div>
  </div>`;
}
function pauseTimer(){ timerSession.running=!timerSession.running; if(timerSession.running) tickTimer(); renderAll(); }
function stopTimer(){ timerSession=null; go('timer'); }
function finishTimer(){
  const minutes = Math.round(timerSession.total/60);
  addXP(state.xpValues.session,'study session'); addCoins(15,'study session');
  state.stats.studySessions++; state.stats.totalStudyMinutes += minutes;
  bumpStreak('study');
  timerSession = null;
  save(); checkAchievements();
  if(focusMode){ focusMode=false; openFocusCheckIn(); }
  else {
    toast('✨ SESSION COMPLETE! Time for a short break 🌙');
    go('timer');
  }
}
function startFocus(){
  focusMode = true;
  window.__focusTask = document.getElementById('focus-task')?.value || 'Focus session';
  startTimer(45);
}

function improvementChart(papers){
  const bySubj = {};
  papers.forEach(p=>{ bySubj[p.subject]=bySubj[p.subject]||[]; bySubj[p.subject].push(p); });
  return `<div class="card"><h3>📈 Improvement</h3>${Object.entries(bySubj).map(([k,list])=>{
    list.sort((a,b)=>a.date.localeCompare(b.date));
    const first = Math.round(list[0].score/list[0].total*100), last = Math.round(list[list.length-1].score/list[list.length-1].total*100);
    const diff = last-first;
    return `<div class="small">${SUBJECT_DEFS[k]?.icon||''} ${k}: ${first}% → ${last}% <span class="${diff>=0?'':''}">(${diff>=0?'+':''}${diff}%)</span></div>`;

}

/* ================= CALENDAR ================= */
let calMonth = new Date().getMonth(), calYear = new Date().getFullYear();
function viewCalendar(){
  const first = new Date(calYear, calMonth, 1);
  const startDay = first.getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const monthName = first.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  let cells = '';
  for(let i=0;i<startDay;i++) cells += `<div></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs = eventsForDate(dateStr);
    cells += `<div class="card-sm" style="min-height:60px; cursor:pointer;" onclick="openDayView('${dateStr}')">
      <b>${d}</b><div>${evs.slice(0,3).map(e=>e.icon).join('')}</div>
    </div>`;
  }
  return `
  <div class="flex-between"><h2>📅 Study Calendar</h2><button class="btn" onclick="openAddEvent()">➕ Add Event</button></div>
  <div class="flex-between">
    <button class="btn ghost" onclick="calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderAll();">← Prev</button>
    <h3>${monthName}</h3>
    <button class="btn ghost" onclick="calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderAll();">Next →</button>
  </div>
  <div class="grid" style="grid-template-columns:repeat(7,1fr); gap:6px; margin-top:10px;">
    ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="small muted" style="text-align:center;">${d}</div>`).join('')}
    ${cells}
  </div>`;
}
function eventsForDate(dateStr){
  const evs = [];
  state.events.filter(e=>e.date===dateStr).forEach(e=>evs.push({icon:e.icon, title:e.title, type:'event'}));
  state.quests.filter(q=>q.dueDate===dateStr).forEach(q=>evs.push({icon:'🎯', title:q.task, type:'quest'}));
  state.papers.filter(p=>p.date===dateStr).forEach(p=>evs.push({icon:'📄', title:p.name, type:'paper'}));
  EXAM_CAMPAIGN.dates.filter(e=>e.date===dateStr).forEach(e=>evs.push({icon:'🧪', title:e.label+' exam', type:'exam'}));
  return evs;
}
function openDayView(dateStr){
  const evs = eventsForDate(dateStr);
  openModal(`<h3>${fmtDate(dateStr)}</h3>
  ${evs.map(e=>`<div class="list-item">${e.icon} ${e.title}</div>`).join('') || '<p class="muted">No events. Add one!</p>'}
  <button class="btn" onclick="closeModal(); openAddEvent('${dateStr}')">➕ Add event on this day</button>`);
}
function openAddEvent(dateStr){
  const icons = {'📚 Study session':'📚','📝 Assignment':'📝','🎯 Quest':'🎯','📄 Practice paper':'📄','🧪 Exam':'🧪','🎤 Oral practice':'🎤','🏫 School event':'🏫','💃 Rehearsal':'💃','🏠 Other':'🏠','😴 Rest day':'😴'};
  openModal(`<h3>➕ Add Calendar Event</h3>
  <label>Type</label><select id="e-type">${Object.keys(icons).map(k=>`<option value="${icons[k]}">${k}</option>`).join('')}</select>

}

  return `
  <div class="flex-between"><h2>📝 Notes</h2><button class="btn" onclick="openAddNote()">➕ New Note</button></div>
  <div class="row">
    <input placeholder="Search notes..." value="${escapeAttr(noteFilter.search)}" oninput="noteFilter.search=this.value; renderAll();" style="max-width:260px;">
    <select onchange="noteFilter.category=this.value; renderAll();">
      <option value="">All categories</option>
      ${cats.map(c=>`<option ${noteFilter.category===c?'selected':''}>${c}</option>`).join('')}
    </select>
  </div>
  <div class="grid grid-2" style="margin-top:12px;">
  ${notes.map(n=>`<div class="card">
    <div class="flex-between"><b>${n.pinned?'📌 ':''}${n.title}</b>
      <span class="row"><button class="icon-btn" onclick="togglePinNote('${n.id}')">📌</button><button class="icon-btn" onclick="deleteNote('${n.id}')">🗑️</button></span>
    </div>
    <span class="tag">${n.category}</span>
    <p class="small" style="white-space:pre-wrap;">${n.content}</p>
  </div>`).join('') || '<p class="muted">No notes yet.</p>'}
  </div>`;
}
function openAddNote(){
  openModal(`<h3>➕ New Note</h3><label>Title</label><input id="n-title">
  <label>Category</label><select id="n-cat">${['Science','Math','Chinese','English','History','Geography','Literature','General'].map(c=>`<option>${c}</option>`).join('')}</select>
  <label>Content</label><textarea id="n-content" rows="6"></textarea>
  <button class="btn" style="margin-top:10px;" onclick="submitNote()">Save Note</button>`);
}
function submitNote(){
  const title = document.getElementById('n-title').value.trim(); if(!title) return;
  state.notes.push({id:uid(), title, category:document.getElementById('n-cat').value, content:document.getElementById('n-content').value, pinned:false, createdAt:new Date().toISOString()});
  save(); closeModal(); renderAll();
}
function deleteNote(id){ state.notes = state.notes.filter(n=>n.id!==id); save(); renderAll(); }
function togglePinNote(id){ const n = state.notes.find(x=>x.id===id); n.pinned=!n.pinned; save(); renderAll(); }

/* ================= IDEAS ================= */
function viewIdeas(){
  return `
  <h2>💡 Study Idea Box</h2>
  <p class="muted">Dump random study ideas here, then turn them into quests later.</p>
  <div class="row"><input id="idea-input" placeholder="e.g. Make a quiz about cells" style="flex:1;"><button class="btn" onclick="addIdea()">➕ Add</button></div>
  <div style="margin-top:12px;">
  ${state.ideas.slice().reverse().map(i=>`<div class="list-item">
    <div style="flex:1;">${i.text}</div>
    <button class="btn small" onclick="ideaToQuest('${i.id}')">→ Quest</button>
    <button class="icon-btn" onclick="deleteIdea('${i.id}')">🗑️</button>
  </div>`).join('') || '<p class="muted">Empty for now.</p>'}
  </div>`;
}
function addIdea(){
  const el = document.getElementById('idea-input'); const text = el.value.trim(); if(!text) return;
  state.ideas.push({id:uid(), text}); save(); renderAll();
}
function deleteIdea(id){ state.ideas = state.ideas.filter(i=>i.id!==id); save(); renderAll(); }
function ideaToQuest(id){
  const idea = state.ideas.find(x=>x.id===id);
  state.quests.push({id:uid(), task:idea.text, subject:'', topic:'', category:'📚 Learn', difficulty:'medium', xp:10, coins:5, dueDate:todayStr(), estTime:20, done:false});
  state.ideas = state.ideas.filter(i=>i.id!==id);
  save(); renderAll(); toast('Turned into a quest! 🎯');
}

/* ================= AI PROMPTS ================= */
function viewAI(){
  const buttons = [
    ['🧠','Quiz me','quiz'],['📚','Teach me this topic','teach'],['❓','Explain my mistake','mistake'],
    ['🎤','Practise my Chinese oral','oral'],['📖','Analyse this literature character','lit'],['➗','Give me maths questions','maths'],
    ['🔬','Test my science knowledge','science'],['🌍','Quiz my geography','geo'],['📜','Quiz my history','history'],['🇬🇧','Practise English','english'],
  ];
  return `
  <h2>🤖 AI Study Assistant</h2>
  <p class="muted">These buttons generate a ready-to-copy prompt for ChatGPT / Claude — nothing is sent automatically.</p>
  <div class="grid grid-3">
  ${buttons.map(([icon,label,key])=>`<button class="btn" onclick="openAIPrompt('${key}','${label}')">${icon} ${label}</button>`).join('')}
  </div>
  <div id="ai-output" style="margin-top:16px;"></div>`;
}
function openAIPrompt(key,label){
  openModal(`<h3>${label}</h3>
  <label>Subject</label><select id="ai-subject">${Object.keys(SUBJECT_DEFS).map(k=>`<option value="${k}">${SUBJECT_DEFS[k].icon} ${SUBJECT_DEFS[k].name}</option>`).join('')}</select>
  <label>Topic</label><input id="ai-topic" placeholder="e.g. photosynthesis">
  <button class="btn" style="margin-top:10px;" onclick="generateAIPrompt('${key}')">Generate Prompt</button>
  <div id="ai-prompt-result" style="margin-top:12px;"></div>`);
}
function generateAIPrompt(key){
  const subject = SUBJECT_DEFS[document.getElementById('ai-subject').value].name;
  const topic = document.getElementById('ai-topic').value || 'this topic';
  const templates = {
    quiz:`Quiz me on ${subject}, specifically ${topic}. Ask me one question at a time, wait for my answer, then tell me if I'm right and explain why.`,
    teach:`Teach me ${topic} in ${subject} step by step, checking my understanding with a short question after each part.`,
    mistake:`I made a mistake on this ${subject} question about ${topic}. Help me understand why I got it wrong and how to avoid this next time.`,
    oral:`Act as a Chinese oral examiner. Ask me questions about "${topic}" and give me feedback on my spoken answers (I'll type them).`,
    lit:`Help me analyse the character related to "${topic}" in my literature text — their traits, development, and why they matter to the story.`,
    maths:`Give me 5 practice questions on ${topic} in Mathematics, ranging from easy to hard, with answers hidden until I ask.`,
    science:`Test my knowledge of ${topic} in Science with active-recall style questions — no multiple choice, make me explain.`,
    geo:`Quiz me on ${topic} in Geography using a mix of recall and applied questions.`,
    history:`Quiz me on ${topic} in History, focusing on causes, events and consequences rather than just dates.`,
    english:`Help me practise English ${topic} — give me a task and then feedback on my response.`,
  };
  const text = templates[key] || `Help me study ${topic} in ${subject}.`;
  document.getElementById('ai-prompt-result').innerHTML = `<textarea id="ai-final" rows="5" readonly>${text}</textarea>
  <button class="btn" style="margin-top:8px;" onclick="copyAIPrompt()">📋 Copy Prompt</button>`;
}
function copyAIPrompt(){
  const el = document.getElementById('ai-final');
  el.select();
  try{ navigator.clipboard.writeText(el.value); toast('Copied! Paste it into your AI chat 🤖'); }
  catch(e){ document.execCommand('copy'); toast('Copied!'); }
}

/* ================= SETTINGS ================= */
function viewSettings(){
  return `
  <h2>⚙️ Settings</h2>
  <div class="card">
    <h3>XP Values</h3>
    <div class="grid grid-3">
    ${Object.keys(state.xpValues).map(k=>`<div><label>${k}</label><input type="number" value="${state.xpValues[k]}" onchange="state.xpValues['${k}']=+this.value; save();"></div>`).join('')}
    </div>
  </div>
  <div class="card">
    <h3>💾 Data Safety</h3>
    <p class="muted">Your data lives in this browser's localStorage. Back it up regularly!</p>
    <div class="row">
      <button class="btn" onclick="exportBackup()">💾 Export Backup</button>
      <label class="btn blue" style="display:inline-block;">📥 Import Backup<input type="file" accept=".json" style="display:none;" onchange="importBackup(event)"></label>
      <button class="btn danger" onclick="resetAllData()">⚠️ Reset All Data</button>
    </div>
  </div>
  <div class="card">
    <h3>Edit defaults</h3>
    <p class="muted">Subjects, exam dates and starter quests can be adjusted directly in each Subject page (topics, priority, exam date) and in Daily Quests. For deeper defaults (e.g. exam campaign dates), edit the <code>EXAM_CAMPAIGN</code> constant near the top of the JavaScript in this file.</p>
  </div>
  `;
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`study-quest-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast('Backup downloaded 💾');
}
function importBackup(evt){
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const imported = JSON.parse(e.target.result);
      if(confirm('Import this backup? This will replace your current data.')){
        state = imported; save(); renderAll(); toast('Backup restored! 🌷');
      }
    }catch(err){ toast('That file could not be read as a backup.'); }
  };
  reader.readAsText(file);
}
function resetAllData(){
  if(confirm('This will permanently erase ALL your Study Quest data. Are you sure?')){
    if(confirm('Really sure? This cannot be undone unless you have a backup.')){
      localStorage.removeItem('studyQuestData');
      state = defaultState(); save(); go('dashboard');
      toast('All data reset. Fresh start! 🌱');
    }
  }
}

/* ================= INIT ================= */
load();
if(!state.rewards) state.rewards = defaultRewards();
renderAll();
setInterval(()=>{ checkDailyRollover(); }, 60000);
</script>
