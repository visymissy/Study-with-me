<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Quest & Bloom — Your Life, Gamified</title>
<style>
/* ============================================================
   QUEST & BLOOM — DESIGN TOKENS
   ============================================================ */
:root{
  --cream:#FBF6EE;
  --cream-deep:#F3EBDC;
  --blush:#F5CFDA;
  --blush-deep:#EFB8C8;
  --lavender:#DDD3F3;
  --lavender-deep:#C9B8EC;
  --sage:#C6E0CB;
  --sage-deep:#A9CFB1;
  --sky:#CBE4F5;
  --sky-deep:#AFD5EE;
  --sun:#F7D883;
  --sun-deep:#F0C24C;
  --coral:#F3A896;
  --ink:#4E4257;
  --ink-soft:#7A6E85;
  --ink-faint:#A99DB4;
  --white:#FFFFFF;
  --shadow:0 6px 18px rgba(120,90,120,0.10), 0 2px 6px rgba(120,90,120,0.08);
  --shadow-sm:0 3px 8px rgba(120,90,120,0.08);
  --shadow-pressed: inset 0 2px 6px rgba(120,90,120,0.15);
  --radius:22px;
  --radius-sm:14px;
  --radius-lg:30px;
  --font-display: -apple-system, "SF Pro Rounded", BlinkMacSystemFont, "Segoe UI", ui-rounded, system-ui, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-pixel: "Courier New", ui-monospace, monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font-body);
  background:
    radial-gradient(circle at 10% 8%, rgba(245,207,218,0.35), transparent 40%),
    radial-gradient(circle at 90% 15%, rgba(203,228,245,0.35), transparent 45%),
    radial-gradient(circle at 50% 95%, rgba(198,224,203,0.35), transparent 50%),
    var(--cream);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
}
::selection{background:var(--sun); color:var(--ink);}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}

/* subtle floating decorations */
.sparkle-layer{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;}
.floaty{position:absolute; opacity:.5; animation:driftY 9s ease-in-out infinite; font-size:18px;}
@keyframes driftY{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-16px) rotate(8deg);}}
@media (prefers-reduced-motion: reduce){
  .floaty{animation:none;}
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

/* ===================== APP SHELL ===================== */
#app{position:relative; z-index:1; display:flex; min-height:100vh;}

/* Sidebar (desktop/tablet) */
#sidebar{
  width:230px; flex:0 0 230px; padding:22px 14px; background:rgba(255,255,255,0.55);
  backdrop-filter:blur(6px); border-right:1px solid rgba(180,150,180,0.15);
  display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:8px; padding:6px 10px 18px; font-family:var(--font-display); font-weight:800; font-size:19px; color:var(--ink);}
.brand span.sub{display:block; font-size:11px; font-weight:600; color:var(--ink-soft); letter-spacing:.04em;}
.navbtn{
  display:flex; align-items:center; gap:10px; padding:11px 13px; border:none; background:transparent;
  border-radius:16px; font-size:14.5px; font-weight:600; color:var(--ink-soft); text-align:left; width:100%;
  transition:background .18s, color .18s, transform .12s;
}
.navbtn:hover{background:rgba(221,211,243,0.35); color:var(--ink);}
.navbtn.active{background:linear-gradient(135deg, var(--blush), var(--lavender)); color:var(--ink); box-shadow:var(--shadow-sm);}
.navbtn:active{transform:scale(.97);}
.navbtn .ic{font-size:18px; width:22px; text-align:center;}

#sidebar-foot{margin-top:auto; padding:10px; font-size:11px; color:var(--ink-faint); text-align:center;}

/* Main content */
#main{flex:1; min-width:0; padding:22px 26px 100px;}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
.stat-pill{
  display:inline-flex; align-items:center; gap:6px; background:var(--white); border-radius:999px;
  padding:7px 13px; font-weight:700; font-size:13px; box-shadow:var(--shadow-sm);
}
.pillbar{display:flex; gap:8px; flex-wrap:wrap;}

.section{display:none; animation:fadeUp .35s ease;}
.section.active{display:block;}
@keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

h1.page-title{font-family:var(--font-display); font-size:26px; margin:0 0 4px; font-weight:800;}
p.page-sub{color:var(--ink-soft); margin:0 0 20px; font-size:14px;}

/* Cards */
.card{
  background:var(--white); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow);
  margin-bottom:16px; position:relative;
}
.card h2, .card h3{font-family:var(--font-display); margin:0 0 10px; font-weight:800;}
.card h3{font-size:16px;}
.grid{display:grid; gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr;}}
@media (max-width:600px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

/* Buttons */
.btn{
  border:none; border-radius:14px; padding:10px 16px; font-weight:700; font-size:13.5px;
  background:var(--cream-deep); color:var(--ink); box-shadow:var(--shadow-sm); transition:transform .12s, box-shadow .12s;
}
.btn:active{transform:scale(.95);}
.btn-primary{background:linear-gradient(135deg, var(--blush-deep), var(--lavender-deep)); color:var(--ink);}
.btn-green{background:linear-gradient(135deg, var(--sage), var(--sage-deep));}
.btn-blue{background:linear-gradient(135deg, var(--sky), var(--sky-deep));}
.btn-sun{background:linear-gradient(135deg, var(--sun), var(--sun-deep));}
.btn-ghost{background:transparent; box-shadow:none; color:var(--ink-soft); text-decoration:underline;}
.btn-sm{padding:6px 10px; font-size:12px; border-radius:10px;}
.btn-danger{background:#F7D3CE; color:#9c4a3a;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

/* Forms */
label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:10px 0 4px;}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{
  width:100%; padding:9px 12px; border-radius:12px; border:1.5px solid #EFE6F5; background:#FCFAFF; font-size:14px; color:var(--ink);
}
textarea{min-height:80px; resize:vertical;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--lavender-deep); outline-offset:1px;}
.field-row{display:flex; gap:10px; flex-wrap:wrap;}
.field-row > *{flex:1; min-width:120px;}
.chip{display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:999px; background:var(--cream-deep); font-size:12px; font-weight:700; margin:2px 4px 2px 0;}
.chip.on{background:linear-gradient(135deg,var(--sage),var(--sage-deep));}
.chip-select{cursor:pointer; border:1.5px solid transparent;}
.chip-select.selected{border-color:var(--ink); background:var(--sun);}

/* XP bar */
.xpbar-wrap{background:#F1EAF8; border-radius:999px; height:16px; overflow:hidden; position:relative; box-shadow:var(--shadow-pressed);}
.xpbar-fill{height:100%; background:linear-gradient(90deg, var(--sage-deep), var(--sun-deep)); border-radius:999px; transition:width .6s ease; position:relative;}
.xpbar-fill::after{content:""; position:absolute; inset:0; background:repeating-linear-gradient(45deg, rgba(255,255,255,0.25) 0 6px, transparent 6px 12px);}

/* Quest item */
.quest{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:16px; background:var(--cream); margin-bottom:8px; transition:background .2s;}
.quest.done{background:var(--sage); opacity:.7;}
.quest.done .qname{text-decoration:line-through;}
.qcheck{width:26px; height:26px; border-radius:50%; border:2.5px solid var(--sage-deep); background:#fff; flex:0 0 26px; display:flex; align-items:center; justify-content:center; font-size:14px;}
.quest.done .qcheck{background:var(--sage-deep); color:#fff;}
.qbody{flex:1; min-width:0;}
.qname{font-weight:700; font-size:14px;}
.qmeta{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
.qxp{font-size:11.5px; font-weight:800; color:#8a6a1f; white-space:nowrap;}

/* Achievement badge */
.badge{display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; padding:14px 8px; border-radius:18px; background:var(--cream); opacity:.4; filter:grayscale(.6);}
.badge.unlocked{opacity:1; filter:none; background:linear-gradient(160deg, var(--sun), var(--blush));}
.badge .bicon{font-size:30px;}
.badge .bname{font-size:12px; font-weight:800;}
.badge .bdesc{font-size:10.5px; color:var(--ink-soft);}

/* Toast / floating XP */
#toastLayer{position:fixed; top:16px; right:16px; z-index:999; display:flex; flex-direction:column; gap:8px; align-items:flex-end;}
.toast{background:var(--white); box-shadow:var(--shadow); border-radius:14px; padding:10px 16px; font-weight:700; font-size:13.5px; animation:toastIn .3s ease, toastOut .3s ease 2.4s forwards;}
@keyframes toastIn{from{opacity:0; transform:translateX(30px);} to{opacity:1; transform:translateX(0);}}
@keyframes toastOut{to{opacity:0; transform:translateY(-10px);}}
.float-xp{position:fixed; font-weight:900; font-size:15px; color:#7a9c5f; z-index:998; pointer-events:none; animation:floatUp 1.1s ease forwards;}
@keyframes floatUp{0%{opacity:1; transform:translateY(0);}100%{opacity:0; transform:translateY(-46px);}}

/* Modal */
.modal-bg{position:fixed; inset:0; background:rgba(78,66,87,0.35); backdrop-filter:blur(2px); z-index:500; display:none; align-items:center; justify-content:center; padding:20px;}
.modal-bg.open{display:flex;}
.modal{background:var(--white); border-radius:24px; padding:22px 22px 20px; max-width:520px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow); animation:modalIn .25s ease;}
@keyframes modalIn{from{opacity:0; transform:scale(.93) translateY(10px);} to{opacity:1; transform:scale(1) translateY(0);}}
.modal h2{font-family:var(--font-display); margin:0 0 12px;}
.modal-close{float:right; background:var(--cream-deep); border:none; width:30px; height:30px; border-radius:50%; font-size:15px;}

/* Bottom nav (mobile) */
#bottomnav{display:none; position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,0.92); backdrop-filter:blur(8px); border-top:1px solid rgba(180,150,180,0.15); z-index:400; padding:4px 2px calc(4px + env(safe-area-inset-bottom));}
#bottomnav .bn-scroll{display:flex; overflow-x:auto; gap:2px;}
.bnbtn{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 12px; border:none; background:none; font-size:9.5px; font-weight:700; color:var(--ink-soft); min-width:56px;}
.bnbtn.active{color:var(--ink);}
.bnbtn .ic{font-size:19px;}

/* Character sprite */
.sprite-stage{background:linear-gradient(180deg, var(--sky), var(--sage) 85%); border-radius:20px; padding:20px; text-align:center; position:relative; overflow:hidden;}
.sprite{font-size:56px; display:inline-block; animation:bob 2.2s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.sprite-walk{animation:walk 0.6s steps(2) infinite;}
@keyframes walk{0%{transform:translateY(0) rotate(-3deg);}100%{transform:translateY(-4px) rotate(3deg);}}
.ground{height:14px; background:var(--sage-deep); border-radius:10px; margin-top:10px; opacity:.6;}

/* Calendar */
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-dow{font-size:10.5px; font-weight:800; text-align:center; color:var(--ink-soft); padding-bottom:4px;}
.cal-cell{aspect-ratio:1; border-radius:12px; background:var(--cream); padding:5px; font-size:11px; font-weight:700; cursor:pointer; display:flex; flex-direction:column; position:relative; transition:background .15s;}
.cal-cell:hover{background:var(--lavender);}
.cal-cell.today{outline:2.5px solid var(--sun-deep);}
.cal-cell.empty{background:transparent; cursor:default;}
.cal-cell.empty:hover{background:transparent;}
.cal-dots{display:flex; gap:2px; flex-wrap:wrap; margin-top:auto;}
.cal-dots span{font-size:9px;}

/* Flashcard */
.flashcard{background:var(--white); border-radius:20px; box-shadow:var(--shadow); padding:30px 20px; text-align:center; min-height:160px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; cursor:pointer; user-select:none;}
.flashcard .fc-face{transition:opacity .2s;}

/* Quiz option */
.quiz-opt{display:block; width:100%; text-align:left; padding:12px 15px; border-radius:14px; background:var(--cream); border:2px solid transparent; margin-bottom:8px; font-weight:600; font-size:14px;}
.quiz-opt.correct{background:var(--sage); border-color:var(--sage-deep);}
.quiz-opt.wrong{background:#F7D3CE; border-color:#e59d8c;}
.quiz-opt.picked:not(.correct):not(.wrong){border-color:var(--ink-faint);}

/* Small helpers */
.muted{color:var(--ink-soft); font-size:12.5px;}
.tiny{font-size:11px; color:var(--ink-faint);}
.center{text-align:center;}
.row{display:flex; align-items:center; gap:8px;}
.between{justify-content:space-between;}
.wrap{flex-wrap:wrap;}
.mt8{margin-top:8px;}
.mt16{margin-top:16px;}
hr.soft{border:none; border-top:1px solid #EFE6F5; margin:14px 0;}
.empty-state{text-align:center; padding:30px 10px; color:var(--ink-soft);}
.empty-state .eicon{font-size:36px; display:block; margin-bottom:6px;}

/* Gambling stations */
.wheel-wrap{display:flex; flex-direction:column; align-items:center; gap:14px;}
.wheel-outer{position:relative; width:260px; height:260px;}
.wheel{width:100%; height:100%; border-radius:50%; position:relative; transition:transform 3.5s cubic-bezier(.15,.8,.15,1); box-shadow:0 0 0 8px #fff, var(--shadow);}
.wheel-pointer{position:absolute; top:-6px; left:50%; transform:translateX(-50%); font-size:26px; z-index:5;}
.scratch-card{position:relative; width:100%; max-width:320px; height:140px; border-radius:18px; margin:0 auto; overflow:hidden; box-shadow:var(--shadow);}
.scratch-canvas{position:absolute; inset:0; cursor:pointer;}
.scratch-prize{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:18px; background:linear-gradient(135deg,var(--sun),var(--coral));}
.slotrow{display:flex; gap:8px; justify-content:center; margin:14px 0;}
.slot-reel{width:64px; height:64px; background:var(--cream); border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:32px; box-shadow:var(--shadow-pressed); overflow:hidden;}
.slot-reel.spinning{animation:slotspin .1s linear infinite;}
@keyframes slotspin{0%{transform:translateY(0);}100%{transform:translateY(-8px);}}

/* Setup wizard */
#setupOverlay{position:fixed; inset:0; z-index:700; background:linear-gradient(160deg,var(--blush),var(--sky)); display:flex; align-items:center; justify-content:center; padding:20px;}
.setup-card{background:var(--white); border-radius:28px; padding:30px 26px; max-width:480px; width:100%; box-shadow:var(--shadow); max-height:90vh; overflow-y:auto;}

@media (max-width:820px){
  #sidebar{display:none;}
  #main{padding:16px 14px 90px;}
  #bottomnav{display:block;}
}

/* ============================================================
   EXTRA MICRO-ANIMATIONS
   ============================================================ */

/* button press ripple */
.btn{position:relative; overflow:hidden;}
.ripple{position:absolute; border-radius:50%; background:rgba(255,255,255,0.55); transform:scale(0); animation:rippleGrow .55s ease-out forwards; pointer-events:none;}
@keyframes rippleGrow{to{transform:scale(3.2); opacity:0;}}

/* checkbox sparkle burst on completing a quest */
.qcheck{position:relative;}
.qcheck.just-checked::before{
  content:"✨"; position:absolute; left:50%; top:50%; font-size:16px;
  animation:checkSparkle .6s ease-out forwards; pointer-events:none;
}
@keyframes checkSparkle{
  0%{transform:translate(-50%,-50%) scale(0.3); opacity:1;}
  100%{transform:translate(-50%,-140%) scale(1.4); opacity:0;}
}
.quest.just-done{animation:questPop .45s ease;}
@keyframes questPop{
  0%{transform:scale(1);}
  35%{transform:scale(1.035);}
  100%{transform:scale(1);}
}

/* blooming flower (self-care / journal / creative / goal wins) */
.bloom-pop{position:fixed; font-size:22px; z-index:998; pointer-events:none; animation:bloomGrow 1.1s cubic-bezier(.2,.8,.3,1.2) forwards;}
@keyframes bloomGrow{
  0%{transform:translateY(0) scale(0.2) rotate(-10deg); opacity:0;}
  30%{opacity:1;}
  60%{transform:translateY(-30px) scale(1.15) rotate(6deg);}
  100%{transform:translateY(-55px) scale(0.9) rotate(0deg); opacity:0;}
}

/* achievement unlock: star burst + badge pop */
.star-burst{position:fixed; z-index:998; pointer-events:none; font-size:18px; animation:starFly 1s ease-out forwards;}
@keyframes starFly{
  0%{transform:translate(0,0) scale(0.4) rotate(0deg); opacity:1;}
  100%{transform:translate(var(--sx), var(--sy)) scale(1.1) rotate(180deg); opacity:0;}
}
.badge.pop-in{animation:badgePop .55s cubic-bezier(.25,.9,.3,1.3);}
@keyframes badgePop{
  0%{transform:scale(0.4) rotate(-8deg); opacity:0;}
  60%{transform:scale(1.12) rotate(3deg); opacity:1;}
  100%{transform:scale(1) rotate(0deg); opacity:1;}
}

/* full-screen level-up celebration */
#levelUpOverlay{
  position:fixed; inset:0; z-index:900; display:none; align-items:center; justify-content:center;
  background:radial-gradient(circle at 50% 40%, rgba(247,216,131,0.55), rgba(78,66,87,0.35));
  animation:fadeIn .3s ease;
}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
.levelup-card{background:var(--white); border-radius:28px; padding:34px 30px; text-align:center; box-shadow:var(--shadow); animation:levelCardPop .6s cubic-bezier(.25,.9,.3,1.3);}
@keyframes levelCardPop{
  0%{transform:scale(0.5) translateY(30px); opacity:0;}
  60%{transform:scale(1.06) translateY(-4px); opacity:1;}
  100%{transform:scale(1) translateY(0);}
}
.levelup-icon{font-size:60px; display:inline-block; animation:levelIconSpin 1.1s ease-in-out;}
@keyframes levelIconSpin{
  0%{transform:scale(0) rotate(-30deg);}
  50%{transform:scale(1.3) rotate(15deg);}
  100%{transform:scale(1) rotate(0deg);}
}
.confetti-piece{position:fixed; top:-20px; z-index:899; border-radius:2px; animation:confettiFall linear forwards;}
@keyframes confettiFall{
  to{ transform:translateY(110vh) rotate(540deg); opacity:0.9; }
}

/* xp bar pulse when it grows */
.xpbar-fill.pulse{animation:xpPulse .5s ease;}
@keyframes xpPulse{0%{filter:brightness(1);}50%{filter:brightness(1.35);}100%{filter:brightness(1);}}

/* quiz feedback shake / bounce */
.shake-once{animation:shakeX .4s ease;}
@keyframes shakeX{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-6px);}
  40%{transform:translateX(6px);}
  60%{transform:translateX(-4px);}
  80%{transform:translateX(4px);}
}
.bounce-once{animation:bounceUp .45s ease;}
@keyframes bounceUp{
  0%{transform:translateY(0);}
  40%{transform:translateY(-8px);}
  100%{transform:translateY(0);}
}

/* streak flame flicker */
.flame-icon{display:inline-block; animation:flicker 1.6s ease-in-out infinite;}
@keyframes flicker{
  0%,100%{transform:scale(1) rotate(0deg);}
  25%{transform:scale(1.08) rotate(-3deg);}
  50%{transform:scale(0.96) rotate(2deg);}
  75%{transform:scale(1.05) rotate(-2deg);}
}

/* gentle card entrance stagger already via .section; add hover lift for cards */
.card{transition:transform .18s ease, box-shadow .18s ease;}
.card:hover{transform:translateY(-2px);}

/* reward redeem coin shower */
.coin-fall{position:fixed; z-index:998; font-size:20px; pointer-events:none; animation:coinFall 1s cubic-bezier(.3,.6,.4,1) forwards;}
@keyframes coinFall{
  0%{transform:translateY(-10px) rotate(0deg); opacity:1;}
  100%{transform:translateY(70px) rotate(360deg); opacity:0;}
}
</style>
</head>
<body>
<div class="sparkle-layer" id="sparkleLayer"></div>

<div id="setupOverlay" style="display:none;">
  <div class="setup-card" id="setupCard"></div>
</div>

<div id="toastLayer"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>

<div id="app">
  <nav id="sidebar">
    <div class="brand">🌷 <div>Quest & Bloom<span class="sub">your life, gamified</span></div></div>
    <div id="navList"></div>
    <div id="sidebar-foot">progress, not perfection 🌱</div>
  </nav>

  <main id="main">
    <div class="topbar">
      <div>
        <h1 class="page-title" id="pageTitle">Home</h1>
      </div>
      <div class="pillbar" id="topPills"></div>
    </div>
    <div id="sections"></div>
  </main>
</div>

<nav id="bottomnav"><div class="bn-scroll" id="bnScroll"></div></nav>

<script>
/* ============================================================
   QUEST & BLOOM — APP LOGIC
   One self-contained file. No network calls anywhere.
   ============================================================ */

/* ---------- CONSTANTS ---------- */
const STORAGE_KEY = "questbloom_state_v1";

const NAV = [
  {id:"home", ic:"🏠", label:"Home"},
  {id:"quests", ic:"🎯", label:"Quests"},
  {id:"quizlab", ic:"🧠", label:"Quiz Lab"},
  {id:"library", ic:"📚", label:"Study Library"},

/* ---------- 30-DAY EXAM ARC SEED ---------- */
function buildDefaultChallengeDays(){
  const start = new Date(2026,7,28); // 28 Aug 2026 (month index 7 = Aug)
  const days = [];
  for(let i=0;i<30;i++){
    const d = new Date(start.getTime()); d.setDate(start.getDate()+i);
    const iso = d.toISOString().slice(0,10);
    const isRest = (i%7===6); // every 7th day a suggested rest day, editable
    days.push({
      date: iso,
      missions: [],
      studyGoals:"",
      rest: isRest,
      funActivity:"",
      notes:""
    });
  }
  return days;
}

let STATE = null;

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){ STATE = freshState(); return; }
    const parsed = JSON.parse(raw);
    // merge with fresh defaults to survive schema growth / empty localStorage gracefully
    const fresh = freshState();
    STATE = Object.assign(fresh, parsed);
    // deep-safety for nested objects added later
    STATE.settings = Object.assign(fresh.settings, parsed.settings||{});
    STATE.settings.xp = Object.assign({...XP_DEFAULTS}, (parsed.settings&&parsed.settings.xp)||{});
    STATE.character = Object.assign(fresh.character, parsed.character||{});
    STATE.library = parsed.library || fresh.library;
    if(!Array.isArray(STATE.exams) || STATE.exams.length===0) STATE.exams = [...DEFAULT_EXAMS];
    if(!Array.isArray(STATE.challengeDays) || STATE.challengeDays.length===0) STATE.challengeDays = buildDefaultChallengeDays();
    if(!Array.isArray(STATE.rewards) || STATE.rewards.length===0) STATE.rewards = [...DEFAULT_REWARDS];
  }catch(e){
    console.warn("Could not parse saved data, starting fresh.", e);
    STATE = freshState();
  }
}

let saveTimer=null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }
    catch(e){ console.error("Save failed", e); toast("⚠️ Couldn't save — storage may be full."); }
  }, 120);
}

/* ---------- SMALL UTILS ---------- */
function uid(prefix){ return (prefix||"id")+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"});
}
function daysUntil(iso){
  const target = new Date(iso+"T00:00:00");
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.ceil((target-now)/86400000);
}
function esc(str){ return (str||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function totalStudyMinutes(s){ return s.studySessions.reduce((a,x)=>a+x.minutes,0); }
function hasBalancedDay(s){
  const days = {};
  s.studySessions.forEach(x=>{days[x.date]=days[x.date]||{}; days[x.date].study=true;});
  s.selfcareLog.forEach(x=>{const d=x.at.slice(0,10); days[d]=days[d]||{}; days[d].care=true;});
  s.selfcareLog.forEach(x=>{if(x.activity.includes("Rest")){const d=x.at.slice(0,10); days[d]=days[d]||{}; days[d].rest=true;}});
  return Object.values(days).some(d=>d.study&&d.care&&d.rest);
}

function ripple(e){
  const btn = e.currentTarget;
  const rect = btn.getBoundingClientRect();
  const r = document.createElement("span");
  const size = Math.max(rect.width, rect.height);
  r.className="ripple";
  r.style.width = r.style.height = size+"px";
  r.style.left = (e.clientX - rect.left - size/2)+"px";
  r.style.top = (e.clientY - rect.top - size/2)+"px";
  btn.appendChild(r);
  setTimeout(()=>r.remove(), 600);
}
document.addEventListener("click", e=>{
  const btn = e.target.closest(".btn");
  if(btn) ripple({currentTarget:btn, clientX:e.clientX, clientY:e.clientY});
});

function sparkleBurst(x,y){
  for(let i=0;i<6;i++){
    const s = document.createElement("div");
    s.textContent="✨"; s.style.position="fixed"; s.style.left=x+"px"; s.style.top=y+"px";
    s.style.fontSize="14px"; s.style.zIndex=997; s.style.pointerEvents="none";
    s.style.transition="all .7s ease";
    document.body.appendChild(s);
    const ang = Math.random()*Math.PI*2, dist=30+Math.random()*30;
    requestAnimationFrame(()=>{
      s.style.transform=`translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist}px)`;
      s.style.opacity="0";
    });
    setTimeout(()=>s.remove(), 750);
  }
}

/* ---------- XP / COINS / LEVEL ---------- */
function addXP(amount, opts){
  opts = opts||{};
  STATE.xp += amount;
  let leveled=false;
  while(STATE.xp >= xpNeededForLevel(STATE.level+1)){
    STATE.level++; leveled=true;
  }
  if(!opts.silent) floatXP("+"+amount+" XP", opts.x, opts.y);
  const xpFillEl = document.querySelector(".xpbar-fill");
  if(xpFillEl){ xpFillEl.classList.remove("pulse"); void xpFillEl.offsetWidth; xpFillEl.classList.add("pulse"); }
  if(leveled){
    const info = levelInfo(STATE.level);
    setTimeout(()=>{ toast(`🌟 LEVEL UP! You're now ${info.icon} ${info.name} (Lv.${info.lvl})`); celebrateLevelUp(info); }, 300);
  }
  checkAchievements();
  saveState();
}
function addCoins(amount, opts){
  opts=opts||{};
  STATE.coins += amount;
  if(amount>0) STATE.lifetimeCoins += amount;
  if(!opts.silent && amount!==0) floatXP((amount>0?"+":"")+amount+" 🪙", (opts.x||window.innerWidth/2)+40, opts.y);
  checkAchievements();
  saveState();
}
function checkAchievements(){
  let unlockedNew=false;
  ACHIEVEMENTS.forEach(a=>{
    if(!STATE.achievementsUnlocked.includes(a.id) && a.check(STATE)){
      STATE.achievementsUnlocked.push(a.id);
      unlockedNew=true;
      setTimeout(()=>{
        toast(`🏆 Achievement unlocked: ${a.icon} ${a.name}`);
        starBurst(window.innerWidth-70, 60, 14);
      }, 500);
    }
  });
  if(unlockedNew) saveState();
}
function bumpStreak(){
  const today = todayISO();
  if(STATE.lastStudyDate===today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yISO = y.toISOString().slice(0,10);
  if(STATE.lastStudyDate===yISO){ STATE.streak++; } else { STATE.streak=1; }
  STATE.lastStudyDate = today;
  saveState();
}

function renderQuestList(el, list){
  if(list.length===0){ el.innerHTML = `<div class="empty-state"><span class="eicon">🌱</span>No quests yet. Add one — one tiny quest at a time.</div>`; return; }
  const sorted = [...list].sort((a,b)=> (a.done - b.done) || (new Date(a.due||"2100-01-01") - new Date(b.due||"2100-01-01")));
  el.innerHTML = sorted.map(q=>`
    <div class="quest ${q.done?"done":""}">
      <button class="qcheck" onclick="toggleQuest('${q.id}', event)">${q.done?"✓":""}</button>
      <div class="qbody">
        <div class="qname">${esc(q.name)}</div>
        <div class="qmeta">${esc(q.subject||"General")} · ${esc(q.category||"Quest")} ${q.due?`· due ${fmtDate(q.due)}`:""} ${q.estMin?`· ~${q.estMin}min`:""} ${q.priority?`· ${q.priority}`:""}</div>
      </div>
      <div class="qxp">+${q.xp}XP<br>🪙${q.coins}</div>
      <button class="btn btn-sm btn-ghost" onclick="deleteQuest('${q.id}')">✕</button>
    </div>
  `).join("");
}
function toggleQuest(id, ev){
  const q = STATE.quests.find(x=>x.id===id);
  if(!q) return;
  q.done = !q.done;
  if(q.done){
    q.doneDate = todayISO();
    const btnEl = ev ? ev.target.closest(".qcheck") : null;
    const rect = btnEl ? btnEl.getBoundingClientRect() : {left:window.innerWidth/2, top:200};
    addXP(q.xp, {x:rect.left, y:rect.top});
    if(q.coins) coinShower(rect.left, rect.top, Math.min(6, q.coins));
    addCoins(q.coins, {silent:true});
    sparkleBurst(rect.left, rect.top);
    if(btnEl){
      btnEl.classList.add("just-checked");
      const questEl = btnEl.closest(".quest");
      if(questEl) questEl.classList.add("just-done");
      setTimeout(()=>{ btnEl.classList.remove("just-checked"); if(questEl) questEl.classList.remove("just-done"); }, 650);
    }
    toast(`Quest complete! "${q.name}" ✨`);
    bumpStreak();
    // handle repeat: spawn next occurrence
    if(q.repeat && q.repeat!=="none"){
      spawnRepeat(q);
    }
  } else {
    addXP(-q.xp,{silent:true}); addCoins(-q.coins,{silent:true});
  }
  saveState();
  refreshCurrentSection();
}
function spawnRepeat(q){
  const base = q.due? new Date(q.due+"T00:00:00") : new Date();
  const next = new Date(base.getTime());
  if(q.repeat==="daily") next.setDate(next.getDate()+1);
  else if(q.repeat==="weekly") next.setDate(next.getDate()+7);
  else return;
  const clone = {...q, id:uid("q"), done:false, doneDate:null, due:next.toISOString().slice(0,10)};
  STATE.quests.push(clone);
}
function deleteQuest(id){
  STATE.quests = STATE.quests.filter(q=>q.id!==id);
  saveState(); refreshCurrentSection();
}

/* ============================================================
   OFFLINE QUIZ GENERATION ENGINE
   Parses plain text notes into question objects using
   sentence-level templates. Fully local, no network.
   ============================================================ */
function splitSentences(text){
  return text
    .replace(/\s+/g," ")
    .split(/(?<=[.!?])\s+(?=[A-Z0-9])/)
    .map(s=>s.trim())
    .filter(s=>s.length>12 && s.split(" ").length>=4);
}

function extractKeyTerm(sentence){
  // naive: look for "X is/are/means/refers to Y" pattern
  const m = sentence.match(/^(.{2,40}?)\s+(is|are|means|refers to|was|were)\s+(.{5,})[.]?$/i);
  if(m) return {term:m[1].trim(), def:m[3].replace(/\.$/,"").trim(), verb:m[2]};
  return null;
}
function findNumbers(sentence){ return sentence.match(/\b\d{1,4}(\.\d+)?\b/g) || []; }
function findCapitalizedTerms(sentence){
  return (sentence.match(/\b([A-Z][a-z]{2,}(?:\s[A-Z][a-z]{2,})?)\b/g)||[]).filter(w=>!/^(The|This|That|These|Those|It|A|An|In|On|At|For|And|But)$/.test(w));
}

function generateQuestionsFromText(text, opts){
  opts = opts||{};
  const sentences = splitSentences(text);
  const questions = [];
  const allTermsPool = new Set();

  sentences.forEach(s=>{
    findCapitalizedTerms(s).forEach(t=>allTermsPool.add(t));
  });

  sentences.forEach((s, idx)=>{
    const defMatch = extractKeyTerm(s);
    // 1) Definition -> "What is X?" short answer
    if(defMatch && defMatch.term.split(" ").length<=6){
      questions.push({
        type:"short",
        q:`What ${defMatch.verb.includes("was")||defMatch.verb.includes("were")?"was":"is"} ${defMatch.term}?`,
        answer:defMatch.def,
        explanation:s,
        source:s
      });
      // flashcard-style true/false (correct)
      questions.push({
        type:"tf",
        q:`True or False: ${s}`,
        options:["True","False"],
        answer:"True",
        explanation:s,
        source:s
      });
      // false version by swapping term with another pool term if possible
      const pool = [...allTermsPool].filter(t=>t.toLowerCase()!==defMatch.term.toLowerCase());
      if(pool.length){
        const swapped = s.replace(defMatch.term, pool[Math.floor(Math.random()*pool.length)]);
        questions.push({
          type:"tf",
          q:`True or False: ${swapped}`,
          options:["True","False"],
          answer:"False",
          explanation:`Correct statement: ${s}`,
          source:s
        });
      }
    }
    // 2) Numbers -> fill in the blank
    const nums = findNumbers(s);
    if(nums.length){
      const n = nums[0];
      const blanked = s.replace(n, "_____");
      questions.push({
        type:"fill",
        q:blanked,
        answer:n,
        explanation:s,
        source:s
      });
    }
    // 3) Lists (contains commas + "and")
    if(/(,.*){2,}and/.test(s)){
      questions.push({
        type:"short",
        q:`List the items mentioned in: "${s.split(",")[0]}..."`,
        answer:s,
        explanation:s,
        source:s
      });
    }
    // 4) Cause/effect
    if(/\bbecause\b|\bdue to\b|\bcauses?\b|\bresults? in\b|\bleads? to\b/i.test(s)){
      questions.push({
        type:"short",
        q:`Explain why: "${s.split(/because|due to/i)[0].trim()}..."`,
        answer:s,
        explanation:s,
        source:s
      });
    }
  });

  // Multiple choice from capitalized terms (matching-style)
  const termsArr = [...allTermsPool];
  if(termsArr.length>=4){
    sentences.forEach(s=>{
      const found = findCapitalizedTerms(s);
      if(found.length===1){
        const correct = found[0];
        const distractors = termsArr.filter(t=>t!==correct).sort(()=>Math.random()-0.5).slice(0,3);
        if(distractors.length===3){
          const blanked = s.replace(correct, "_____");
          const options = [correct, ...distractors].sort(()=>Math.random()-0.5);
          questions.push({
            type:"mc",
            q:blanked,
            options,
            answer:correct,
            explanation:s,
            source:s
          });
        }
      }
    });
  }

  // de-duplicate by question text, then shuffle & trim
  const seen = new Set();
  const unique = questions.filter(q=>{ if(seen.has(q.q)) return false; seen.add(q.q); return true; });
  unique.sort(()=>Math.random()-0.5);

  let filtered = unique;
  if(opts.type && opts.type!=="mixed"){
    filtered = unique.filter(q=>q.type===opts.type);
    if(filtered.length===0) filtered = unique; // fallback if type not producible
  }
  const n = opts.count || 10;
  return filtered.slice(0, n);
}

function generateFlashcardsFromText(text, subject, topic){
  const sentences = splitSentences(text);
  const cards = [];
  sentences.forEach(s=>{
    const d = extractKeyTerm(s);
    if(d && d.term.split(" ").length<=6){
      cards.push({id:uid("fc"), front:d.term, back:d.def, subject:subject||"", topic:topic||"", srs:{box:1, due:todayISO()}});
    }
  });
  return cards;
}

function runQuizGeneration(){
  const src = document.getElementById("quizSource").value;
  const subject = document.getElementById("quizSubject").value;
  const topic = document.getElementById("quizTopic").value;
  const count = parseInt(document.getElementById("quizCount").value)||8;
  const type = document.getElementById("quizType").value;
  quizDraft.subject = subject; quizDraft.topic = topic;

  let text = "";
  if(src==="text" || src==="file" || src==="image"){
    text = (document.getElementById("quizRawText")||{value:""}).value.trim();
    if(!text){ toast("Add some notes text first 📝"); return; }
  } else if(src==="library"){
    const sel = Array.from(document.getElementById("libNoteSelect").selectedOptions).map(o=>o.value);
    if(sel.length===0){ toast("Select at least one note"); return; }
    text = STATE.notesList.filter(n=>sel.includes(n.id)).map(n=>n.content).join(" ");
  } else if(src==="manual"){
    showQuizPreview(); return;
  }
  const qs = generateQuestionsFromText(text, {count, type});
  if(qs.length===0){
    toast("Couldn't generate questions from that text — try longer, full sentences, or add questions manually.");
    return;
  }
  quizDraft.questions = qs;
  showQuizPreview();
  toast(`Generated ${qs.length} question(s) from your notes 🌟`);

let activeQuiz = null; // {quiz, idx, correctCount, results:[]}
function startQuiz(quizId){
  const quiz = STATE.quizzes.find(q=>q.id===quizId);
  if(!quiz) return;
  activeQuiz = { quiz, idx:0, correctCount:0, results:[] };
  renderQuizRuntime();
}
function renderQuizRuntime(){
  const container = document.getElementById("sections");
  container.innerHTML = `<div class="section active"><div id="quizRuntimeArea"></div></div>`;
  const el = document.getElementById("quizRuntimeArea");
  const {quiz, idx} = activeQuiz;
  if(idx >= quiz.questions.length){ finishQuiz(); return; }
  const q = quiz.questions[idx];
  let optionsHtml = "";
  if(q.type==="mc" || q.type==="tf"){
    optionsHtml = (q.options||["True","False"]).map(o=>`<button class="quiz-opt" onclick="answerQuiz('${esc(o).replace(/'/g,"\\'")}', this)">${esc(o)}</button>`).join("");
  } else {
    optionsHtml = `<input type="text" id="shortAnsInput" placeholder="Type your answer..." style="margin-bottom:10px;">
      <button class="btn btn-primary" onclick="answerQuiz(document.getElementById('shortAnsInput').value, null)">Submit</button>`;
  }
  el.innerHTML = `
    <div class="card">
      <div class="row between"><h3 style="margin:0;">${esc(quiz.name)}</h3><span class="muted">Question ${idx+1} / ${quiz.questions.length}</span></div>
      <div class="xpbar-wrap mt8"><div class="xpbar-fill" style="width:${Math.round(100*idx/quiz.questions.length)}%"></div></div>
      <h2 class="mt16" style="font-size:19px;">${esc(q.q)}</h2>
      <div class="mt16" id="quizOptions">${optionsHtml}</div>
      <div id="quizFeedback" class="mt16"></div>
      <button class="btn btn-ghost mt16" onclick="exitQuiz()">Exit quiz</button>
    </div>
  `;
}
function normalize(s){ return (s||"").toString().trim().toLowerCase().replace(/[.,!?]/g,""); }
function answerQuiz(userAnswer, btnEl){
  const {quiz, idx} = activeQuiz;
  const q = quiz.questions[idx];
  let correct;
  if(q.type==="short" || q.type==="fill"){
    correct = normalize(userAnswer)===normalize(q.answer) || normalize(q.answer).includes(normalize(userAnswer)) && normalize(userAnswer).length>2;
  } else {
    correct = normalize(userAnswer)===normalize(q.answer);
  }
  if(btnEl){
    document.querySelectorAll(".quiz-opt").forEach(b=>{
      b.classList.add("picked");
      if(normalize(b.textContent)===normalize(q.answer)) b.classList.add("correct");
    });
    if(!correct) btnEl.classList.add("wrong");
  }
  activeQuiz.results.push({q:q.q, userAnswer, correctAnswer:q.answer, correct, explanation:q.explanation||"", subject:quiz.subject, topic:quiz.topic});
  if(correct) activeQuiz.correctCount++;
  else {
    STATE.mistakes.push({id:uid("mis"), question:q.q, userAnswer, correctAnswer:q.answer, subject:quiz.subject||"General", topic:quiz.topic||"", date:todayISO(), explanation:q.explanation||"", confidence:"low", mastered:false});
    saveState();
  }
  document.getElementById("quizFeedback").innerHTML = `
    <div class="card ${correct?"bounce-once":"shake-once"}" style="background:${correct?"var(--sage)":"#FBE3DD"}; box-shadow:none; margin:0;">
      <b>${correct?"✅ Correct!":"Not quite 🌿"}</b>
      ${!correct?`<div class="mt8">Correct answer: <b>${esc(q.answer)}</b></div>`:""}
      ${q.explanation?`<div class="tiny mt8">${esc(q.explanation)}</div>`:""}
    </div>
    <button class="btn btn-primary mt16" onclick="nextQuizQuestion()">Next →</button>
  `;
  if(correct) sparkleBurst(window.innerWidth/2, window.innerHeight/2.4);
  document.querySelectorAll("#quizOptions button").forEach(b=>b.disabled=true);
}
function nextQuizQuestion(){ activeQuiz.idx++; renderQuizRuntime(); }
function exitQuiz(){ activeQuiz=null; goTo("quizlab"); }
function finishQuiz(){
  const {quiz, correctCount, results} = activeQuiz;
  const total = quiz.questions.length;
  const acc = Math.round(100*correctCount/total);
  const xpEarned = Math.round(20 + (correctCount*3));
  const coinsEarned = Math.max(2, correctCount);
  addXP(xpEarned, {silent:true}); addCoins(coinsEarned, {silent:true});
  STATE.quizAttempts.push({id:uid("att"), quizId:quiz.id, score:correctCount, total, date:todayISO(), subject:quiz.subject});
  saveState();
  const weak = [...new Set(results.filter(r=>!r.correct).map(r=>r.topic||r.subject||"this topic"))];
  const container = document.getElementById("sections");
  container.innerHTML = `<div class="section active"><div class="card center">
    <h2>🎉 QUIZ COMPLETE</h2>
    <div style="font-size:38px; font-weight:900; margin:10px 0;">${correctCount} / ${total}</div>
    <div class="muted">Accuracy: ${acc}%</div>
    <div class="row" style="justify-content:center; gap:20px; margin:16px 0;">
      <div class="stat-pill">+${xpEarned} XP</div>
      <div class="stat-pill">+${coinsEarned} 🪙</div>
    </div>
    ${weak.length? `<h3 class="mt16">Study These Next</h3><div class="row wrap" style="justify-content:center;">${weak.map(w=>`<span class="chip">${esc(w)}</span>`).join("")}</div>`:"<p class='muted'>Great work across the board! 🌟</p>"}
    <div class="row mt16" style="justify-content:center; gap:10px;">
      <button class="btn btn-primary" onclick="goTo('quizlab')">Back to Quiz Lab</button>
      <button class="btn btn-green" onclick="goTo('mistakebank')">Review Mistake Bank</button>
    </div>
  </div></div>`;
  activeQuiz=null;
  if(acc>=80) confettiShower();
  checkAchievements();
}

  flashSession = { cards: dueFlashcards(), idx:0, flipped:false };

  const area = document.getElementById("flashSessionArea");
  if(!area) return;
  if(!flashSession || flashSession.idx>=flashSession.cards.length){
    area.innerHTML = flashSession? `<div class="empty-state"><span class="eicon">🌟</span>Review complete!</div>` : "";
    flashSession=null; return;
  }
  const c = flashSession.cards[flashSession.idx];
  area.innerHTML = `
    <div class="tiny">${flashSession.idx+1} / ${flashSession.cards.length}</div>

      <button class="btn btn-danger btn-sm" onclick="rateFlash('again')">Again</button>
      <button class="btn btn-sm" onclick="rateFlash('hard')">Hard</button>
      <button class="btn btn-green btn-sm" onclick="rateFlash('good')">Good</button>
      <button class="btn btn-sun btn-sm" onclick="rateFlash('easy')">Easy</button>
    </div>
  `;
}
function flipFlash(){ flashSession.flipped = !flashSession.flipped; renderFlashSession(); }
function rateFlash(rating){
  const c = flashSession.cards[flashSession.idx];
  const real = STATE.flashcards.find(x=>x.id===c.id);
  const boxDelta = {again:-1, hard:0, good:1, easy:2}[rating];
  real.srs.box = Math.max(1, Math.min(6, real.srs.box + boxDelta));
  const intervalDays = [0,1,2,4,7,14,30][real.srs.box];
  const d = new Date(); d.setDate(d.getDate()+intervalDays);
  real.srs.due = d.toISOString().slice(0,10);
  saveState();
  flashSession.idx++; flashSession.flipped=false;
  renderFlashSession();
}

  timerState.subject = document.getElementById("timerSubject").value;
  timerState.total = len*60; timerState.remaining = len*60; timerState.running=true;
  document.getElementById("startTimerBtn").style.display="none";
  document.getElementById("stopTimerBtn").style.display="inline-block";
  document.getElementById("timerSprite").classList.add("sprite-walk");
  tickTimer();
  timerState.interval = setInterval(tickTimer, 1000);
}
function tickTimer(){
  if(timerState.remaining<=0){ completeTimer(); return; }
  const mm = Math.floor(timerState.remaining/60), ss = timerState.remaining%60;
  const disp = document.getElementById("timerDisplay");
  if(disp) disp.textContent = `${mm}:${ss.toString().padStart(2,"0")}`;
  const track = document.getElementById("worldTrack");
  if(track){
    const progress = 1-(timerState.remaining/timerState.total);
    const stageIdx = Math.min(WORLD_STAGES.length-1, Math.floor(progress*WORLD_STAGES.length));
    track.innerHTML = WORLD_STAGES.map((s,i)=> i===stageIdx? `<b style="filter:drop-shadow(0 0 6px gold);">${s}</b>` : s).join(" ");
  }
  timerState.remaining--;
}
function completeTimer(){
  clearInterval(timerState.interval); timerState.running=false;
  const mins = Math.round(timerState.total/60);
  STATE.studySessions.push({id:uid("sess"), date:todayISO(), minutes:mins, subject:timerState.subject, method:timerState.method});
  bumpStreak();
  const xp = Math.min(40, Math.max(10, Math.round(mins*0.8)));
  addXP(xp); addCoins(Math.round(xp/4));
  toast("Quest Complete! 🌟 Your brain deserves a break too.");
  saveState();
  document.getElementById("timerSprite").classList.remove("sprite-walk");
  refreshCurrentSection();
}
function stopTimer(){
  clearInterval(timerState.interval); timerState.running=false;
  document.getElementById("timerSprite").classList.remove("sprite-walk");
  toast("No worries — you can pick this back up anytime.");
  refreshCurrentSection();
}

const SCRATCH_PRIZES = [
  {label:"+8 🪙", type:"coins", value:8},
  {label:"+15 🪙", type:"coins", value:15},
  {label:"+12 XP", type:"xp", value:12},
  {label:"Try again next time", type:"none", value:0},
  {label:"+25 🪙 JACKPOT", type:"coins", value:25},
];
function openScratchModal(){
  if(STATE.coins<10){ toast("Not enough coins (need 10 🪙)"); return; }
  addCoins(-10, {silent:true}); saveState();
  const prize = SCRATCH_PRIZES[Math.floor(Math.random()*SCRATCH_PRIZES.length)];
  openModal(`
    <h2 class="center">🎫 Scratch Card</h2>
    <div class="scratch-card">
      <div class="scratch-prize">${prize.label}</div>
      <canvas class="scratch-canvas" id="scratchCanvas" width="320" height="140"></canvas>
    </div>
    <p class="center tiny mt16">Drag your finger/mouse across the card to reveal your prize.</p>
  `);
  setupScratchCanvas(prize);
}
function setupScratchCanvas(prize){
  const canvas = document.getElementById("scratchCanvas");
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#D8CDEE";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#4E4257"; ctx.font="bold 16px sans-serif"; ctx.textAlign="center";
  ctx.fillText("Scratch here ✨", canvas.width/2, canvas.height/2);
  ctx.globalCompositeOperation = "destination-out";
  let scratching=false, revealed=false, cleared=0;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches? e.touches[0].clientY : e.clientY) - rect.top;
    return {x:cx*(canvas.width/rect.width), y:cy*(canvas.height/rect.height)};
  }
  function scratch(e){
    const {x,y} = pos(e);
    ctx.beginPath(); ctx.arc(x,y,18,0,Math.PI*2); ctx.fill();
    cleared++;
    if(cleared>40 && !revealed){ revealed=true; applyScratchPrize(prize); }
  }
  canvas.addEventListener("mousedown", e=>{scratching=true; scratch(e);});
  canvas.addEventListener("mousemove", e=>{ if(scratching) scratch(e); });
  window.addEventListener("mouseup", ()=>scratching=false);
  canvas.addEventListener("touchstart", e=>{scratching=true; scratch(e); e.preventDefault();}, {passive:false});
  canvas.addEventListener("touchmove", e=>{ if(scratching) scratch(e); e.preventDefault(); }, {passive:false});
  canvas.addEventListener("touchend", ()=>scratching=false);
}
function applyScratchPrize(prize){
  if(prize.type==="coins") addCoins(prize.value);
  else if(prize.type==="xp") addXP(prize.value);
  toast(prize.type==="none" ? "No prize this time — thanks for playing! 🌿" : `You won: ${prize.label}`);
}

/* ---------- SLOT MACHINE ---------- */
const SLOT_SYMBOLS = ["🌸","🍀","🌟","🍒","🌙","🪙"];
function openSlotsModal(){
  if(STATE.coins<12){ toast("Not enough coins (need 12 🪙)"); return; }
  openModal(`
    <h2 class="center">🎰 Bloom Slots</h2>
    <div class="slotrow">
      <div class="slot-reel" id="reel1">🌸</div>
      <div class="slot-reel" id="reel2">🍀</div>
      <div class="slot-reel" id="reel3">🌟</div>
    </div>
    <div class="center"><button class="btn btn-sun" id="pullBtn" onclick="pullSlots()">Pull Lever — 12 🪙</button></div>
    <div id="slotResult" class="center mt16"></div>
  `);
}
function pullSlots(){
  if(STATE.coins<12){ toast("Not enough coins"); return; }
  addCoins(-12, {silent:true}); saveState();
  document.getElementById("pullBtn").disabled=true;
  const reels = [document.getElementById("reel1"),document.getElementById("reel2"),document.getElementById("reel3")];
  reels.forEach(r=>r.classList.add("spinning"));
  const results = reels.map(()=>SLOT_SYMBOLS[Math.floor(Math.random()*SLOT_SYMBOLS.length)]);
  let ticks=0;
  const spin = setInterval(()=>{
    reels.forEach(r=>{ r.textContent = SLOT_SYMBOLS[Math.floor(Math.random()*SLOT_SYMBOLS.length)]; });
    ticks++;
    if(ticks>12){
      clearInterval(spin);
      reels.forEach((r,i)=>{ r.textContent=results[i]; r.classList.remove("spinning"); });
      evaluateSlots(results);
    }
  }, 90);
}
function evaluateSlots(results){
  let msg, coinsWon=0, xpWon=0;
  if(results[0]===results[1] && results[1]===results[2]){ coinsWon=40; msg="🎉 TRIPLE MATCH! Jackpot!"; confettiShower(); }
  else if(results[0]===results[1] || results[1]===results[2] || results[0]===results[2]){ coinsWon=10; xpWon=5; msg="Nice — a pair! Small win."; }
  else { msg="No match this time — thanks for playing! 🌿"; }
  if(coinsWon) addCoins(coinsWon);
  if(xpWon) addXP(xpWon);
  document.getElementById("slotResult").innerHTML = `<h3 class="bounce-once">${msg}</h3>${coinsWon?`<div>+${coinsWon} 🪙</div>`:""}`;
  document.getElementById("pullBtn").disabled = STATE.coins<12;
}

/* ---------- EXPORT / IMPORT ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify(STATE, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `quest-and-bloom-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast("Backup downloaded 💾");
}
function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      if(!parsed || typeof parsed!=="object") throw new Error("bad file");
      STATE = Object.assign(freshState(), parsed);
      saveState();
      toast("Data imported! Welcome back 🌷");
      goTo("home");
    }catch(err){ toast("Couldn't read that file — is it a Quest & Bloom backup?"); }
  };
  reader.readAsText(file);
}
function resetAllData(){
  if(!confirm("This will erase everything and cannot be undone. Continue?")) return;
  if(!confirm("Really sure? Consider exporting a backup first.")) return;
  localStorage.removeItem(STORAGE_KEY);
  STATE = freshState();
  location.reload();
}

    <div class="row between mt16">
      ${step>0? `<button class="btn btn-ghost" onclick="renderSetupStep(${step-1})">← Back</button>`:`<button class="btn btn-ghost" onclick="skipSetup()">Skip setup</button>`}
      ${step<steps.length-1? `<button class="btn btn-primary" onclick="advanceSetup(${step})">Next →</button>` : `<button class="btn btn-primary" onclick="finishSetup()">Enter Quest & Bloom 🌟</button>`}
    </div>
  `;
}
function advanceSetup(step){
  if(step===0){
    setupData.name = document.getElementById("setupName").value.trim();
    setupData.greetingName = document.getElementById("setupGreet").value.trim();
  }
  if(step===2){ setupData.goals = document.getElementById("setupGoals").value; }
  renderSetupStep(step+1);
}
function addSetupSubject(){
  const v = document.getElementById("addSubjectInput").value.trim();
  if(v){ setupData.subjects.push(v); renderSetupStep(1); }
}
function removeSetupSubject(i){ setupData.subjects.splice(i,1); renderSetupStep(1); }
function skipSetup(){
  STATE.profile.setupDone = true;
  saveState();
  document.getElementById("setupOverlay").style.display="none";
  boot();
}
function finishSetup(){
  STATE.profile.name = setupData.name;
  STATE.profile.greetingName = setupData.greetingName || setupData.name;
  STATE.profile.subjects = setupData.subjects.length? setupData.subjects : [...DEFAULT_SUBJECTS];
  STATE.library.subjects = STATE.profile.subjects.map((n,i)=>({id:"lib"+i, name:n, topics:[]}));
  if(setupData.goals.trim()){
    STATE.goals.push({id:uid("goal"), title:setupData.goals.trim(), category:"Personal projects", progress:0, subtasks:[], notes:""});
  }
  STATE.profile.setupDone = true;
  saveState();
  document.getElementById("setupOverlay").style.display="none";
  boot();
}

/* ============================================================
   DECORATIVE FLOATIES
   ============================================================ */
function spawnFloaties(){
  const layer = document.getElementById("sparkleLayer");
  const icons = ["✨","🌸","🍃","⭐","☁️"];
  for(let i=0;i<10;i++){
    const s = document.createElement("div");
    s.className="floaty"; s.textContent = icons[i%icons.length];
    s.style.left = (Math.random()*100)+"vw";
    s.style.top = (Math.random()*100)+"vh";
    s.style.animationDelay = (Math.random()*6)+"s";
    s.style.animationDuration = (7+Math.random()*6)+"s";
    layer.appendChild(s);
  }
}

/* ============================================================
   INIT
   ============================================================ */
function boot(){
  buildNav();
  renderTopPills();
  goTo("home");
  setInterval(()=>{ if(currentSection==="home") renderTopPills(); }, 30000);
}
window.addEventListener("DOMContentLoaded", ()=>{
  loadState();
  spawnFloaties();
  checkAchievements();
  if(!STATE.profile.setupDone){
    showSetupWizard();
  } else {
    boot();
  }
});
window.addEventListener("beforeunload", ()=>{ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){} });
</script>
</body>
</html>
